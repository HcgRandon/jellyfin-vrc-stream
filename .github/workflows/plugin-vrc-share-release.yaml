name: "🚀 Release VRC Share Plugin"

# Triggered by pushing a tag like "plugin-v1.0.0.0" - separate from the
# proxy's own Docker release tags (vX.Y.Z) so the two never trigger each
# other. Builds the plugin, creates the GitHub Release for the tag (with the
# zip attached), and appends the new version to manifest.json so it shows up
# for anyone who has added this repo's manifest.json URL as a Jellyfin
# plugin repository.
on:
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jellyfin-plugin-vrc-share

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#plugin-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set assembly version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s#<AssemblyVersion>.*</AssemblyVersion>#<AssemblyVersion>${VERSION}</AssemblyVersion>#" Jellyfin.Plugin.VrcShare/Jellyfin.Plugin.VrcShare.csproj
          sed -i "s#<FileVersion>.*</FileVersion>#<FileVersion>${VERSION}</FileVersion>#" Jellyfin.Plugin.VrcShare/Jellyfin.Plugin.VrcShare.csproj

      - name: Build
        run: dotnet build -c Release

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP_NAME="Jellyfin.Plugin.VrcShare_${VERSION}.zip"
          (cd Jellyfin.Plugin.VrcShare/bin/Release/net9.0 && zip "$ZIP_NAME" Jellyfin.Plugin.VrcShare.dll)
          mv "Jellyfin.Plugin.VrcShare/bin/Release/net9.0/$ZIP_NAME" "./$ZIP_NAME"
          CHECKSUM=$(md5sum "$ZIP_NAME" | cut -d ' ' -f1)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: "VRC Share ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: jellyfin-plugin-vrc-share/${{ steps.package.outputs.zip_name }}

      - name: Update manifest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          from datetime import datetime, timezone

          manifest_path = "manifest.json"
          with open(manifest_path) as f:
              manifest = json.load(f)

          repo = os.environ["REPO"]
          tag = os.environ["TAG_NAME"]

          entry = {
              "version": os.environ["VERSION"],
              "changelog": f"See https://github.com/{repo}/releases/tag/{tag} for details.",
              "targetAbi": "10.11.0.0",
              "sourceUrl": "https://github.com/{repo}/releases/download/{tag}/{zip}".format(
                  repo=repo,
                  tag=tag,
                  zip=os.environ["ZIP_NAME"],
              ),
              "checksum": os.environ["CHECKSUM"],
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
          }

          # Replace any existing entry for this version (e.g. a re-run of this
          # workflow for the same tag) instead of appending a duplicate.
          versions = [v for v in manifest[0]["versions"] if v.get("version") != entry["version"]]
          versions.insert(0, entry)
          manifest[0]["versions"] = versions

          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit manifest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Release VRC Share plugin ${VERSION}"
          git push origin HEAD:main
